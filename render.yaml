# render.yaml
# 🚀 Render Blueprint for Chatbot App (React + Node.js)

services:
  # === Backend API Service ===
  - type: web
    name: chatbot-backend
    env: node
    plan: free
    region: oregon
    buildCommand: |
      cd backend
      npm install
    startCommand: |
      cd backend
      npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Google Gemini API Key configured via Render Dashboard Environment Variables
      - key: GOOGLE_API_KEY
        sync: false

  # === Frontend (React + Vite) ===
  - type: static
    name: chatbot-frontend
    region: oregon
    buildCommand: cd react && npm install && npm run build
    staticPublishPath: react/dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://chatbot-backend.onrender.com

# === Metadata ===
version: "1"
name: chatbot